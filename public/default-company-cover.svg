<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b4a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f5132;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.15)" />
    </pattern>
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Base gradient -->
  <rect width="1200" height="300" fill="url(#bg)" />
  <!-- Grid pattern -->
  <rect width="1200" height="300" fill="url(#grid)" />
  <!-- Dot pattern -->
  <rect width="1200" height="300" fill="url(#dots)" />
  <!-- Overlay for depth -->
  <rect width="1200" height="300" fill="url(#overlay)" />
  <!-- Decorative circles -->
  <circle cx="950" cy="-60" r="220" fill="rgba(255,255,255,0.05)" />
  <circle cx="1100" cy="320" r="180" fill="rgba(255,255,255,0.04)" />
  <circle cx="80" cy="280" r="150" fill="rgba(0,0,0,0.08)" />
  <!-- Subtle wave at bottom -->
  <path d="M0 240 Q300 200 600 230 Q900 260 1200 220 L1200 300 L0 300 Z" fill="rgba(0,0,0,0.12)" />
</svg>
